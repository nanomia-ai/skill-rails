name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify package and tag versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const packageLock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const tag = process.env.RELEASE_TAG;
          const expectedTag = `v${packageJson.version}`;
          const lockRoot = packageLock.packages?.[''];

          if (tag !== expectedTag) {
            console.error(`Tag ${tag} does not match package.json version ${packageJson.version}; expected ${expectedTag}.`);
            process.exit(1);
          }

          if (packageLock.version !== packageJson.version || lockRoot?.version !== packageJson.version) {
            console.error('package-lock.json does not match package.json version.');
            process.exit(1);
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Run repository verification
        run: npm run verify

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving it unchanged."
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
