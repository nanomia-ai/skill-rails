<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 160" role="img" aria-labelledby="title" aria-describedby="description">
  <title id="title">SkillRails</title>
  <desc id="description">A dark rounded square holds railway tracks receding toward a soft, distant train light, beside the SkillRails wordmark.</desc>
  <defs>
    <linearGradient id="rail-depth" x1="0" y1="43" x2="0" y2="104" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a7b5c0" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#edf2f5"/>
    </linearGradient>
    <radialGradient id="distant-light">
      <stop stop-color="#fff0d4" stop-opacity="0.3"/>
      <stop offset="0.3" stop-color="#fff0d4" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#fff0d4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .symbol-frame {
      fill: #101215;
      stroke: #30363d;
      stroke-width: 1.2;
    }

    .wordmark {
      fill: #1f2328;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 112px;
      font-weight: 800;
      letter-spacing: -4px;
    }

    @media (prefers-color-scheme: dark) {
      .symbol-frame {
        stroke: #444c56;
      }

      .wordmark {
        fill: #f0f6fc;
      }
    }
  </style>
  <g transform="translate(208.4 18.4) scale(1.1)" aria-hidden="true">
    <rect class="symbol-frame" x="0.6" y="0.6" width="110.8" height="110.8" rx="16"/>
    <g fill="#81909e">
