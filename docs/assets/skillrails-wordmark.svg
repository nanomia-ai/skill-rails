      <path d="M37.5 64H74.5L75.3 66H36.7Z" opacity="0.65"/>
      <path d="M28.5 80H83.5L84.6 83H27.4Z" opacity="0.8"/>
      <path d="M17 100H95L96.5 104H15.5Z"/>
    </g>
    <g fill="url(#rail-depth)">
      <path d="M51 43H53L31 104H26Z"/>
      <path d="M59 43H61L86 104H81Z"/>
